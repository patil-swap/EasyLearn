<html lang="en" vid="0">

<head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">Doc Intelligence // Empty State</title>
    <style vid="5">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

        :root {
            --bg: #ffffff;
            --text-main: #111111;
            --text-mut: #666666;
            --border: #e5e5e5;
            --accent: #FF5E00;
            --pill-bg: #f2f2f2;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f5f5;
            color: var(--text-main);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }


        .app-shell {
            width: 375px;
            height: 812px;
            background: var(--bg);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-mark svg {
            width: 20px;
        }

        .header-title {
            font-size: 14px;
            line-height: 1.1;
            text-align: center;
        }

        .header-title span {
            color: var(--text-mut);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-mut);
            margin-bottom: 16px;
            display: block;
        }

        .upload-card {
            background: #fafafa;
            border: 1px dashed #cccccc;
            padding: 48px 20px;
            text-align: center;
            margin-bottom: 32px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-card:hover {
            background: #f5f5f5;
        }

        .text-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            display: block;
        }

        .text-subtitle {
            font-size: 11px;
            color: var(--text-mut);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 32px;
            opacity: 0.4;
            pointer-events: none;
        }

        .pill {
            background: var(--pill-bg);
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 12px;
            font-family: var(--font);
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ccc;
            flex-shrink: 0;
        }

        .status-container {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .status-msg {
            font-size: 10px;
            color: var(--text-mut);
            font-style: italic;
        }

        .status-title {
            font-size: 10px;
            color: var(--text-mut);
            font-style: italic;
            margin: 4px 0;
        }

        .footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: white;
        }

        .input-stub-disabled {
            background: #f8f8f8;
            padding: 12px 16px;
            border-radius: 24px;
            color: #bbbbbb;
            font-size: 13px;
            border: 1px solid #eeeeee;
        }
    </style>
</head>

<body vid="6">

    <div class="app-shell" vid="7">
        <header class="header" vid="8">
            <div class="header-title" vid="13">
                <span vid="14">Doc</span> Intelligence
            </div>
            <div class="menu-icon" vid="15">
                <svg width="20" height="6" viewBox="0 0 24 8" fill="none" vid="16">
                    <rect width="24" height="1.5" fill="#111" vid="17"></rect>
                    <rect y="6" width="24" height="1.5" fill="#111" vid="18"></rect>
                </svg>
            </div>
        </header>

        <div class="content" vid="19">
            <span class="section-label" vid="20">Source Document</span>
            <div class="upload-card" vid="21">
                <span class="text-title" vid="22">Upload New Book</span>
                <span class="text-subtitle" vid="23">Supports EPUB, PDF, TXT <span className="mx-1">|</span> Max size:
                    50MB</span>
            </div>

            <span class="section-label" vid="24">Analysis Tools</span>
            <div class="tools-grid" vid="25">
                <div class="pill" vid="26"><span class="dot" vid="27"></span>Summary</div>
                <div class="pill" vid="30"><span class="dot" vid="31"></span>Character Arc</div>
                <div class="pill" vid="28"><span class="dot" vid="29"></span>Question</div>
                <div class="pill" vid="32"><span class="dot" vid="33"></span>Plot</div>
                <div class="pill" vid="34"><span class="dot" vid="35"></span>Concept</div>
                <div class="pill" vid="36"><span class="dot" vid="37"></span>Problem</div>
            </div>

            <div class="status-container" vid="38">
                <span class="section-label" vid="39">Library Status</span>
                <p class="status-msg" vid="40">Status: Waiting</p>
                <p class="status-title" vid="41">No active document</p>
            </div>
        </div>

        <div class="footer" vid="42">
            <div class="input-stub-disabled" vid="43">
                Upload a book to begin
            </div>
        </div>
    </div>

</body>

</html>
